[project]
name = "sealsmodel"
description = "Land-use change model and downscaler"
readme = "README.md"
requires-python = ">=3.6"
license = { file = "LICENSE" }
maintainers = [
        {name = "Justin Andrew Johnson"}
]
keywords = ["geospatial", "raster", "shapefile"]
classifiers = [
        "Development Status :: 5 - Production/Stable",
        "Intended Audience :: Science/Research",
        "Programming Language :: Cython",
        "Programming Language :: Python :: 3",
]
# hazelbean>=2.0.0 is a hard floor, not a preference: run files call
# p.skip_tasks(p.tasks_to_skip) unguarded, and ProjectFlow only initializes that
# attribute from 2.0.0 on. Any earlier hazelbean raises AttributeError on every
# run. The rest of the stack (numpy, pandas, GDAL, ...) comes from conda in the
# documented install, so it is deliberately not pinned here.
dependencies = ["hazelbean>=2.0.0"]
dynamic = ["version"]

[project.urls]
repository = "https://github.com/jandrewjohnson/seals_dev"

[build-system]
requires = [
        "setuptools>=74.1",  # Ensure your setuptools version supports this TOML config
        "wheel",
        "cython>3.0.0",
        "setuptools_scm", # Added setuptools_scm here as it's used below
        'oldest-supported-numpy; python_version<"3.8"',
        'numpy>2; python_version>="3.8"',
]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "post-release"
local_scheme = "node-and-date"

# Added section to control package discovery for flat layout
[tool.setuptools.packages.find]
where = ["."]
exclude = ["seals_tests*"]